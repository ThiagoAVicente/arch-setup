# cava for the bar's music ripple (read by Visualizer.qml): a few smoothed
# bands as plain ascii numbers, one frame per line
[general]
bars = 48
framerate = 30
autosens = 1
sleep_timer = 2

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
channels = mono

[smoothing]
noise_reduction = 77
