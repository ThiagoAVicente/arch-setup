# Styled after the quickshell bar: dark glass pills with a red hairline
# (quickshell/Theme.qml: panel, barBorder, barText)
$font = FiraCode Nerd Font
$panel = rgba(16, 16, 18, 0.92)
$red = rgba(230, 56, 64, 0.55)
$redHi = rgba(255, 90, 96, 0.95)
$text = rgba(255, 255, 255, 0.92)
$dim = rgba(255, 255, 255, 0.45)

general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    # Current wallpaper, linked by scripts/change-wallpaper.sh
    path = ~/.cache/lock-wallpaper
    # Shown if no wallpaper has been picked yet
    color = rgba(16, 16, 18, 1.0)
    blur_passes = 2
    blur_size = 6
    brightness = 0.55
    contrast = 1.0
}

# ── Greeting + clock ─────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:0] ~/scripts/lock-info.sh greeting
    font_size = 20
    font_family = $font
    color = $dim

    position = 0, 290
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 110
    font_family = FiraCode Nerd Font Light
    color = $text

    position = 0, 170
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 18
    font_family = $font
    color = $dim

    position = 0, 70
    halign = center
    valign = center
}

# ── Password pill ────────────────────────────────────────────────────
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 1
    rounding = -1
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true

    outer_color = $red
    inner_color = $panel
    font_color = $text
    check_color = rgba(255, 255, 255, 0.6)
    fail_color = $redHi
    capslock_color = rgba(255, 190, 90, 0.9)

    fade_on_empty = false
    placeholder_text = <span foreground="##ffffff73">󰌾  password</span>
    fail_text = <span foreground="##ff5a60">incorrect</span>

    font_family = $font
    font_size = 14

    position = 0, -40
    halign = center
    valign = center
}

# ── Now playing (bottom) ─────────────────────────────────────────────
shape {
    monitor =
    size = 460, 42
    rounding = -1
    color = $panel
    border_size = 1
    border_color = $red

    position = 0, 40
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:2000] ~/scripts/lock-info.sh music
    font_size = 13
    font_family = $font
    color = $text

    position = 0, 52
    halign = center
    valign = bottom
}

# ── Battery (top right) ──────────────────────────────────────────────
shape {
    monitor =
    size = 110, 36
    rounding = -1
    color = $panel
    border_size = 1
    border_color = $red

    position = -24, -24
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:30000] ~/scripts/lock-info.sh battery
    font_size = 12
    font_family = $font
    color = $text

    position = -46, -33
    halign = right
    valign = top
}
